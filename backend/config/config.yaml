# Main configuration file for AI Task Manager

# Application settings
app:
  name: "AI Task Manager"
  version: "1.0.0"
  debug: false
  log_level: "INFO"

# Database configuration (reference to db/database.yaml)
defaults:
  - db: database
  - llm: model_config
  - llm: insult_prompts
  - llm: summary_prompts

# API settings
api:
  host: "0.0.0.0"
  port: 8000
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:3001"
  workers: 4

# Feature flags
features:
  enable_ai_insults: true
  enable_ai_summaries: true
  enable_analytics: true
  auto_generate_insults: true  # Automatically generate insults on deadline check
