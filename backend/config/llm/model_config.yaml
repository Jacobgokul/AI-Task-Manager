# LLM model configuration for vLLM API

# Model settings
model_name: "Qwen/Qwen3-VL-4B-Instruct"  # Change to your model

# API endpoint (vLLM server endpoint)
# For local development: http://localhost:8001/v1
# For production: create llm/production.yaml with your vLLM server URL
api_base: "http://192.168.18.249:8000/v1"

# API key (vLLM often doesn't require a real key, but some deployments might)
# For production: override in llm/production.yaml if needed
api_key: "EMPTY"

# Generation parameters
temperature: 0.7
max_tokens: 150
top_p: 0.9
frequency_penalty: 0.0
presence_penalty: 0.0

# Timeout settings
request_timeout: 30  # seconds

# Retry settings
max_retries: 3
retry_delay: 1  # seconds
