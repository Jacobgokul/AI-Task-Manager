# Database configuration for PostgreSQL

# Database connection settings
host: "localhost"
port: 5432
database: "taskmanager"
user: "taskmanager_user"

# Password - Set your actual database password here
# For production, use Hydra's config group overrides (e.g., create db/production.yaml)
password: "1234"

# Connection pool settings
pool_size: 10
max_overflow: 20
pool_pre_ping: true

# SQL echo (set to true for debugging)
echo: false

# Connection timeout
connect_timeout: 30
